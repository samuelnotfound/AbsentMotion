name: Timeline work area APK
run-name: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'AbsentMotion Lag Test APK' || 'Timeline work area APK' }}

on:
  push:
    branches:
      - feature/expandable-layer-rows
      - fix/timeline-scrub-responsiveness

permissions:
  contents: read

jobs:
  foss-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: debian:trixie
    env:
      TEST_FLAG: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'amLagTest' || 'amTimelineTest' }}
      TEST_PACKAGE: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'app.absentmotion.lagtest' || 'app.absentmotion.timeline' }}
      TEST_LABEL: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'AbsentMotion Lag Test' || 'AbsentMotion Timeline Test' }}
      TEST_APK: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'AbsentMotion-Lag-Test.apk' || 'AbsentMotion-timeline-test.apk' }}
      TEST_ARTIFACT: ${{ github.ref_name == 'fix/timeline-scrub-responsiveness' && 'absentmotion-lag-test-apk' || 'timeline-work-area-apk' }}
      DEBIAN_FRONTEND: noninteractive
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK: /opt/android-sdk/ndk/30.0.16248370
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl unzip xz-utils bzip2 python3 build-essential clang lld ninja-build openjdk-21-jdk-headless
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Check out dependencies
        run: |
          for path in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/third_party/FFamp" "$GITHUB_WORKSPACE/third_party/ncnn" "$GITHUB_WORKSPACE/third_party/whisper.cpp"; do
            git config --global --add safe.directory "$path"
          done
          git config -f .gitmodules submodule.third_party/FFamp.url https://github.com/Comett1225/FFamp.git
          git submodule update --init --depth=1 --recursive
      - name: Install the Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
      - name: Prepare the source as F-Droid does
        run: |
          rm -rf third_party/whisper.cpp/models third_party/whisper.cpp/examples third_party/whisper.cpp/bindings third_party/ncnn/examples third_party/ncnn/benchmark third_party/ncnn/python third_party/ncnn/images
          echo 'org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64' >> gradle.properties
      - name: Build Skia
        run: tools/build_skia.sh
      - name: Build FFamp's Xvid library
        run: third_party/FFamp/third_party/build_android.sh build/ffamp-android
      - name: Create a temporary Android test signing key
        run: |
          keytool -genkeypair -storetype JKS -keystore "$RUNNER_TEMP/timeline-test.jks" \
            -alias timeline-test -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android -dname "CN=$TEST_LABEL"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/timeline-test.jks
          storePassword=android
          keyAlias=timeline-test
          keyPassword=android
          EOF
      - name: Check grouping and the workspace cache
        run: |
          ./gradlew :app:testFossDebugUnitTest --no-daemon \
            --tests app.absentmotion.editor.GroupAndSnapTest \
            --tests app.absentmotion.editor.PreviewCacheTest \
            --tests app.absentmotion.editor.PreviewDependenciesTest \
            --tests app.absentmotion.TrimLimitTest \
            --tests app.absentmotion.KeyScopeTest
      - name: Build the signed test APK
        run: |
          ./gradlew :app:assembleFossRelease "-P${TEST_FLAG}=true" --no-daemon
          cp android/build/outputs/apk/foss/release/app-foss-release.apk "$TEST_APK"
      - name: Verify APK package, label, and signature
        run: |
          python3 tools/apk_check.py --any-signer --package-id "$TEST_PACKAGE" "$TEST_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$TEST_APK" | grep -Fx "application-label:'$TEST_LABEL'"
      - name: Check the Android API floor
        run: python3 tools/api_floor.py "$TEST_APK"
      - name: Upload the signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.TEST_ARTIFACT }}
          path: ${{ env.TEST_APK }}
          if-no-files-found: error
