name: Viewport compiler checks

on:
  push:
    branches:
      - codex/viewport-checks

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile the desktop editor and tests
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          if ($IsWindows) {
            ./gradlew.bat -p pc compileKotlin compileTestKotlin --no-daemon
          } else {
            ./gradlew -p pc compileKotlin compileTestKotlin --no-daemon
          }
          exit $LASTEXITCODE

  native-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned Skia headers
        shell: bash
        run: |
          revision=$(sed -n 's/^COMMIT=//p' tools/build_skia.sh)
          git init -q third_party/skia
          git -C third_party/skia fetch --depth=1 https://skia.googlesource.com/skia.git "$revision"
          git -C third_party/skia checkout --detach FETCH_HEAD
      - name: Compile the changed common renderer sources
        shell: bash
        run: |
          clang++ -std=c++20 -fno-rtti -fsyntax-only -Ithird_party/skia -Ishared/cpp \
            shared/cpp/camera.cpp shared/cpp/model.cpp shared/cpp/styles.cpp shared/cpp/preview.cpp

  android-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the Android compile SDK
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile the Android editor
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew :app:compileFossDebugKotlin --no-daemon
