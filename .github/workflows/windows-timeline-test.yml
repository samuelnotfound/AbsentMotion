name: Windows timeline test

on:
  push:
    branches:
      - codex/windows-layer-rows-test

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Enable long checkout paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out native dependencies
        run: |
          git submodule update --init --depth=1 --recursive -- third_party/ncnn third_party/whisper.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SKIA_DIR=$env:GITHUB_WORKSPACE/third_party/skia" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the native build tools
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8.exe'
          curl.exe --fail --location --retry 3 --output $installer 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') { throw 'LLVM checksum mismatch' }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          & "$env:ProgramFiles/LLVM/bin/clang-cl.exe" --version

      - name: Restore the Windows Skia libraries
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: skia-libs
        with:
          path: |
            third_party/skia/out/win-ft-x64/*.lib
            third_party/skia/out/win-x64/icudtl.dat
          key: windows-2025-skia-95ee33d7-clang-22.1.8-${{ hashFiles('linux/skia-args.gn', 'tools/skia-patches/*.patch') }}

      - name: Build Skia for Windows
        env:
          AM_SKIA_CACHE_HIT: ${{ steps.skia-libs.outputs.cache-hit }}
        run: |
          $revision = '95ee33d7ec7791ab9c071675710a14fe6408ae4f'
          git init -q $env:SKIA_DIR
          git -C $env:SKIA_DIR fetch --depth 1 https://skia.googlesource.com/skia $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:SKIA_DIR checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/skia_sync.py $env:SKIA_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem tools/skia-patches/*.patch | ForEach-Object {
            git -C $env:SKIA_DIR apply $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not apply $($_.Name)" }
          }

          if ($env:AM_SKIA_CACHE_HIT -eq 'true') { exit 0 }

          $gnZip = Join-Path $env:RUNNER_TEMP 'gn.zip'
          $gnDir = Join-Path $env:RUNNER_TEMP 'gn'
          curl.exe --fail --location --retry 3 --output $gnZip 'https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/git_revision:b2afae122eeb6ce09c52d63f67dc53fc517dbdc8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $gnZip -Algorithm SHA256).Hash -ne '7249F55D6F22B55AFFA68AAF19D2F597C39946299216E12D78EAC6CC1469F8A1') { throw 'GN checksum mismatch' }
          Expand-Archive $gnZip $gnDir
          $clang = (Join-Path $env:ProgramFiles 'LLVM').Replace('\', '/')
          $out = Join-Path $env:SKIA_DIR 'out/win-ft-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          @(Get-Content linux/skia-args.gn) + @(
            'target_cpu = "x64"'
            "clang_win = ""$clang"""
            'skia_use_freetype = true'
          ) | Set-Content -Path (Join-Path $out 'args.gn') -Encoding ascii
          Push-Location $env:SKIA_DIR
          & "$gnDir/gn.exe" gen out/win-ft-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja -C out/win-ft-x64 skia pathops skparagraph skshaper skunicode_core skunicode_icu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out/win-x64 | Out-Null
          Copy-Item out/win-ft-x64/icudtl.dat out/win-x64/icudtl.dat
          Pop-Location

      - name: Save the Windows Skia libraries
        if: steps.skia-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            third_party/skia/out/win-ft-x64/*.lib
            third_party/skia/out/win-x64/icudtl.dat
          key: ${{ steps.skia-libs.outputs.cache-primary-key }}

      - name: Prepare the shared FFmpeg build
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          curl.exe --fail --location --retry 3 --output $zip 'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-24-12-41/ffmpeg-n8.1.3-41-ga8029b6528-win64-gpl-shared-8.1.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '25b945937b065bb76741b773f4517341c6e95a7eb6dcbf13dafa6182e1ce5724') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive $zip $out
          $build = Get-ChildItem -LiteralPath $out -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'include/libavcodec/avcodec.h') } | Select-Object -First 1
          if (-not $build) { throw 'FFmpeg development headers are missing' }
          "FFMPEG_DIR=$($build.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the portable Windows app
        env:
          AM_WINDOWS_FFMPEG_ONLY: '1'
        working-directory: pc
        run: .\gradlew.bat createDistributable --no-daemon

      - name: Verify the desktop package
        run: |
          $app = 'pc/build/compose/binaries/main/app/AbsentMotion'
          foreach ($file in @('AbsentMotion.exe', 'runtime/bin/server/jvm.dll')) {
            if (-not (Test-Path "$app/$file")) { throw "Missing $file" }
          }
          foreach ($file in @('amdesktop.dll', 'icudtl.dat', 'ffmpeg.exe')) {
            if (-not (Get-ChildItem $app -Recurse -File -Filter $file)) { throw "Missing $file" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AbsentMotion-windows-x64
          path: pc/build/compose/binaries/main/app/AbsentMotion/
          if-no-files-found: error
